<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Photo Mania</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; width: 100%; max-width: 400px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .theme-input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 10px; }
        .theme-input:focus { border-color: #d4af37; background: #000; color: #fff; box-shadow: none; }
        .btn-gold { background: #d4af37; color: #000; font-weight: bold; padding: 12px; border-radius: 10px; width: 100%; border: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="fw-bold mb-1">Admin Portal</h3>
        <p class="text-muted mb-4 small">Authorized personnel only.</p>
        <form id="loginForm">
            <input type="password" id="adminPass" class="form-control theme-input mb-3" placeholder="Enter Admin Password" required>
            <button type="submit" class="btn btn-gold">Access Command Center</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('button');
            btn.innerText = "Verifying...";
            
            try {
                const res = await fetch('http://localhost:5000/api/admin/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('adminPass').value })
                });
                if(res.status === 200) {
                    localStorage.setItem('adminToken', 'authorized');
                    window.location.href = 'admin.html';
                } else {
                    alert("Incorrect Password");
                    btn.innerText = "Access Command Center";
                }
            } catch(err) { alert("Server offline."); btn.innerText = "Access Command Center"; }
        });
    </script>
</body>
</html>
