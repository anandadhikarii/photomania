<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | Photo Mania</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid #333; border-radius: 15px; overflow: hidden; background: #000; }
        .result-box { display: none; padding: 30px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .success-bg { background-color: #198754; }
        .danger-bg { background-color: #dc3545; }
        .warning-bg { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Gate Check-In</h2>
            <p class="text-muted">Scan attendee QR codes to verify entry.</p>
        </div>

        <!-- The Camera Viewport -->
        <div id="reader"></div>

        <!-- The Result Screen -->
        <div id="resultBox" class="result-box">
            <h1 id="statusText" class="fw-bold mb-3">WAITING...</h1>
            <h4 id="attendeeName" class="fw-bold mb-1"></h4>
            <p id="attendeeDetails" class="mb-4"></p>
            <button class="btn btn-light rounded-pill px-5 py-2 fw-bold" onclick="resetScanner()">Scan Next Ticket</button>
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const resultBox = document.getElementById('resultBox');
        const readerBox = document.getElementById('reader');

        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        // Handle a successful QR Code scan
        async function onScanSuccess(decodedText, decodedResult) {
            // Stop scanning temporarily
            html5QrCode.stop();
            readerBox.style.display = 'none';
            resultBox.style.display = 'block';
            
            // Extract the Ticket ID from the scanned URL (e.g., https://photomania.com/verify/PM26-ABCD1 -> PM26-ABCD1)
            const ticketId = decodedText.split('/').pop();
            
            document.getElementById('statusText').innerText = "VERIFYING...";
            resultBox.className = "result-box bg-secondary";

            try {
                // Ping the backend verification route
                const response = await fetch(`http://localhost:5000/api/verify/${ticketId}`, { method: 'POST' });
                const data = await response.json();

                if (response.status === 200) {
                    // Valid Ticket
                    resultBox.className = "result-box success-bg";
                    document.getElementById('statusText').innerText = "ACCESS GRANTED";
                    document.getElementById('attendeeName').innerText = data.user.name;
                    document.getElementById('attendeeDetails').innerText = `Package: ₹${data.user.package} | ${data.user.college}`;
                } else if (response.status === 400 && data.message.includes("ALREADY USED")) {
                    // Ticket Already Scanned Previously
                    resultBox.className = "result-box warning-bg";
                    document.getElementById('statusText').innerText = "ALREADY CHECKED IN!";
                    document.getElementById('attendeeName').innerText = data.user.name;
                    document.getElementById('attendeeDetails').innerText = "This ticket was already used at the gate.";
                } else {
                    // Fake Ticket
                    resultBox.className = "result-box danger-bg";
                    document.getElementById('statusText').innerText = "INVALID TICKET";
                    document.getElementById('attendeeName').innerText = "FAKE OR NOT FOUND";
                    document.getElementById('attendeeDetails').innerText = "";
                }
            } catch (err) {
                resultBox.className = "result-box danger-bg";
                document.getElementById('statusText').innerText = "NETWORK ERROR";
            }
        }

        function resetScanner() {
            resultBox.style.display = 'none';
            readerBox.style.display = 'block';
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }

        // Start the camera on load (Requests camera permission)
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch(err => {
            alert("Camera access denied or not found.");
        });
    </script>
</body>
</html>
